name: baggage_fee_calculator
description: A beginner Flutter app for calculating excess baggage fees.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/aeroplane.png"

flutter:
  uses-material-design: true


